<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="启育 QeEdu 文档：快速开始、私有化部署、数据安全、校园场景与 API。"
    />
    <link rel="icon" type="image/png" href="/qeedu-logo.png" />
    <title>QeEdu Docs</title>
    <script>
      ;(() => {
        try {
          const theme = localStorage.getItem('qeedu-docs-theme') === 'light' ? 'light' : 'dark'
          const simpleBackground = localStorage.getItem('qeedu-docs-simple-background') !== 'false'

          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.classList.toggle('docs-simple-background', simpleBackground)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
